<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Chat Socket.IO UNA</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { font: 16px/1.4 Helvetica, Arial, sans-serif; background: #f4f6f8; color: #1c1c1c; }
      header { position: fixed; top: 0; left: 0; right: 0; min-height: 64px; background: #0b3a4a; color: #fff; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 8px 16px; z-index: 2; }
      header h1 { font-size: 18px; font-weight: 600; }
      #identity { display: flex; align-items: center; gap: 10px; font-size: 14px; }
      #identity-picture { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; display: none; }
      #logout { color: #fff; }
      #messages { list-style-type: none; margin: 0; padding: 80px 16px 150px; }
      #messages li { padding: 10px 12px; margin-bottom: 8px; background: #fff; border-radius: 8px; }
      #messages li:nth-child(odd) { background: #e7eef2; }
      #messages img, #messages video, #messages iframe { max-width: 100% !important; height: auto; }
      #messages iframe { width: 100% !important; aspect-ratio: 16 / 9; }
      form { background: #fff; border-top: 1px solid #d5dde3; padding: 12px 16px; position: fixed; bottom: 0; width: 100%; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; z-index: 2; }
      form input, form button { font: inherit; border-radius: 6px; padding: 10px 12px; }
      form input { border: 1px solid #b7c3cc; }
      form input:focus { outline: 2px solid #1a7fa3; border-color: transparent; }
      form input[readonly] { background: #edf2f4; color: #34474e; }
      form button { background: rgb(130, 224, 255); border: none; cursor: pointer; }
      form button:disabled { cursor: wait; opacity: .6; }
      #nombre { width: 180px; }
      #m { flex: 1; min-width: 180px; }
      #aviso { flex-basis: 100%; margin: 0; color: #4a5963; font-size: 13px; }
      #socket-status { flex-basis: 100%; min-height: 18px; color: #8a2635; font-size: 13px; }
    </style>
  </head>
  <body>
    <header>
      <h1>Chat UNA</h1>
      <div id="identity" aria-live="polite">
        <img id="identity-picture" alt="Foto de perfil">
        <span id="identity-name">Cargando identidad…</span>
        <a id="logout" href="/logout">Cerrar sesión</a>
      </div>
    </header>
    <ul id="messages"></ul>
    <form action="">
      <input id="nombre" autocomplete="off" placeholder="Username" aria-label="Nombre" readonly/>
      <input id="m" autocomplete="off" placeholder="Escriba un mensaje o pegue una URL" aria-label="Mensaje" disabled/>
      <button type="submit" disabled>Send</button>
      <p id="aviso">Si el mensaje es solo una URL de imagen o de video, se muestra en el chat.</p>
      <p id="socket-status" role="alert"></p>
    </form>
    <script src="https://cdn.socket.io/4.8.4/socket.io.js"></script>
    <script src="https://code.jquery.com/jquery-1.11.1.js"></script>
    <script>
      var colorHexTxt = '';
      var socket = null;

      function getRandomColor() {
        var letters = '0123456789ABCDEF';
        var color = '#';
        for (var i = 0; i < 6; i++) {
          color += letters[Math.floor(Math.random() * 16)];
        }
        return color;
      }

      function redirectToLogin() {
        window.location.assign('/?login_required=1');
      }

      function connectChat(profile) {
        $('#nombre').val(profile.name).prop('readonly', true);
        $('#identity-name').text(profile.name);
        if (profile.picture) {
          $('#identity-picture').attr('src', profile.picture).show();
        }

        socket = io();
        socket.on('connect', function () {
          $('#socket-status').text('');
          $('#m, form button').prop('disabled', false);
          $('#m').trigger('focus');
        });

        socket.on('connect_error', function () {
          $('#socket-status').text('La sesión ya no es válida. Vuelve a iniciar sesión.');
          $('#m, form button').prop('disabled', true);
          window.setTimeout(redirectToLogin, 800);
        });

        socket.on('disconnect', function (reason) {
          $('#m, form button').prop('disabled', true);
          if (reason === 'io server disconnect') {
            $('#socket-status').text('La sesión se cerró. Vuelve a iniciar sesión.');
          }
        });

        socket.on('Evento-Mensaje-Server', function (msg) {
          var msgJson = JSON.parse(msg);
          var mensajeDisplay = "<b style='color:" + msgJson.color + "'>" + msgJson.nombre + '</b>: ' + msgJson.mensaje;
          $('#messages').append($('<li>').html(mensajeDisplay));
          window.scrollTo(0, document.body.scrollHeight);
        });
      }

      $(function () {
        fetch('/api/me', { credentials: 'same-origin' })
          .then(function (response) {
            if (!response.ok) {
              throw new Error('authentication');
            }
            return response.json();
          })
          .then(connectChat)
          .catch(redirectToLogin);

        $('form').submit(function () {
          var mensajeTxt = $('#m').val();
          if (!socket || !socket.connected || mensajeTxt.trim() === '') {
            return false;
          }

          if (colorHexTxt === '') {
            colorHexTxt = getRandomColor();
          }

          var jsonMsg = { nombre: $('#nombre').val(), mensaje: mensajeTxt, color: colorHexTxt };
          socket.emit('Evento-Mensaje-Server', JSON.stringify(jsonMsg));
          $('#m').val('');
          return false;
        });
      });
    </script>
  </body>
</html>
