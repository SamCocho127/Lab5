<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Acceso a UNA Chat</title>
    <style>
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; font: 16px/1.5 Helvetica, Arial, sans-serif; color: #17313b; background: #eef4f6; }
      main { width: min(100%, 480px); padding: 36px; background: #fff; border-radius: 14px; box-shadow: 0 18px 45px rgba(11, 58, 74, .16); }
      h1 { margin-top: 0; color: #0b3a4a; }
      .button { display: inline-block; margin-top: 12px; padding: 12px 18px; color: #fff; background: #126b8a; border-radius: 8px; text-decoration: none; font-weight: 600; }
      .button:focus { outline: 3px solid #82e0ff; outline-offset: 3px; }
      #auth-message { min-height: 24px; color: #8a2635; }
      .scope { margin-top: 24px; color: #52646b; font-size: 14px; }
    </style>
  </head>
  <body>
    <main>
      <h1>UNA Chat</h1>
      <p>Inicia sesión con Google mediante Auth0 para acceder al chat.</p>
      <p id="auth-message" role="alert"></p>
      <a id="login-google" class="button" href="/login">Continuar con Google</a>
      <p class="scope">Esta configuración funciona únicamente en <code>http://localhost:3000</code>.</p>
    </main>
    <script>
      (function () {
        var params = new URLSearchParams(window.location.search);
        var message = document.getElementById('auth-message');
        if (params.has('auth_error')) {
          message.textContent = 'No se pudo completar el inicio de sesión. Puedes intentarlo de nuevo.';
        } else if (params.has('login_required')) {
          message.textContent = 'Debes iniciar sesión para acceder al chat.';
        }
      }());
    </script>
  </body>
</html>
